<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="twitter:title" content="青岛海边亲子 · 4天3晚">
<meta name="twitter:description" content="石老人 · 小麦岛 · 帆船 · 银沙滩｜带 2 岁宝宝不赶场">

<style>
:root{
  --bg:#f1f8fa; --card:#fff; --ink:#12333f; --dim:#5f7b86;
  --brand:#0e7c9c; --brand2:#f0a03c; --line:#dcebf0; --danger:#d2694a; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding-bottom:0;min-height:100%;-webkit-font-smoothing:antialiased}
.app{max-width:600px;margin:0 auto;padding:14px 13px 0}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px}
.brand{display:flex;align-items:center;gap:9px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#0e7c9c,#4fc3d9);display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;flex:none}
.brand h1{font-size:16px;line-height:1.2}
.brand p{font-size:11px;color:var(--dim)}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--dim);padding:5px 10px;white-space:nowrap}
.hero{background:linear-gradient(130deg,#0e7c9c,#57c6dd);border-radius:20px;padding:17px;color:#fff;margin-bottom:12px;box-shadow:0 10px 24px rgba(14,124,156,.18)}
.hero h2{font-size:19px;line-height:1.35;font-weight:800}
.hero p{font-size:12.5px;opacity:.9;margin-top:4px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.quick a,.quick button{display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;padding:9px 6px;font-size:12.5px;font-weight:700;text-decoration:none;cursor:pointer}
.section{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:15px 0 8px}
.section h3{font-size:16px}
.section span{font-size:11px;color:var(--dim)}
.daystrip{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.daychip{flex:none;width:62px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 4px;text-align:center;cursor:pointer}
.daychip .d{font-size:10.5px;color:var(--dim)}
.daychip .n{font-size:17px;font-weight:800;margin-top:2px}
.daychip small{display:block;font-size:9.5px;color:#93a09b}
.daychip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.daychip.on .d,.daychip.on small{color:rgba(255,255,255,.82)}
.daychip.on .n{color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px}
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.day-head h2{font-size:16.5px;line-height:1.35}
.day-head .tag{flex:none;font-size:10.5px;color:#0b6b4c;background:#e2f2ea;border-radius:999px;padding:3px 8px;margin-top:3px}
.tipbox{background:#fff8e9;border:1px solid #f3e2bc;border-radius:12px;padding:8px 11px;margin-bottom:8px}
.tipbox p{font-size:12px;color:#7a6231;margin:3px 0;display:flex;gap:5px}
.tipbox p::before{content:"•";color:#d99b2b}
.item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .t{flex:none;font-size:10.5px;font-weight:800;color:var(--brand);background:#e7f3ee;border-radius:9px;padding:4px 6px;height:fit-content;min-width:52px;text-align:center}
.item .body{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:14.5px;line-height:1.3}
.item .rv{font-size:12.2px;color:#52615c;margin-top:3px}
.item .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:10.5px;background:#f0f4f1;color:#5b6c65;border-radius:999px;padding:2px 8px;white-space:nowrap}
.chip.book{background:#fdeadd;color:#b0471f}
.actrow{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 8px;font-size:13.5px;font-weight:700;border:none;cursor:pointer;text-decoration:none;background:#eef4f0;color:#0d5d47}
.btn.primary{background:var(--brand);color:#fff}
.btn.gold{background:#fff3dd;color:#9a6500}
.dining{background:#fbf8ef;border-radius:12px;padding:9px 11px;margin-top:8px}
.dining h4{font-size:12px;color:#9a6500}
.meal{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#42524b;padding-top:3px}
.meal b{color:#b0471f;white-space:nowrap;font-weight:600}
.foot-note{margin-top:16px;text-align:center;font-size:11px;color:#97a59f;line-height:1.7}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px 6px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;max-width:640px;margin:0 auto}
.tabbar button{flex:1;border:none;background:none;padding:6px 2px;font-size:9.5px;color:#8a9891;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;cursor:pointer}
.tabbar button .ic{font-size:18px;line-height:1}
.tabbar button.on{color:var(--brand);font-weight:700}
.panel{display:none}
.panel.on{display:block}
.daycard-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:5px}
.daycard-head b{font-size:15px}
.gobtn{flex:none;border:none;background:#e7f3ee;color:#0b6b4c;font-size:11px;font-weight:700;border-radius:999px;padding:5px 10px;cursor:pointer}
.mealrow{border:1px solid #efe8d2;background:#fffdf7;border-radius:13px;padding:10px 12px;margin-bottom:8px}
.mealrow .mt{font-size:11px;color:#9a6500;font-weight:800}
.mealrow .pl{font-weight:700;font-size:14px;margin-top:2px}
.mealrow .hs{font-size:11px;color:var(--dim);margin:1px 0 5px}
.dish{display:flex;justify-content:space-between;gap:10px;font-size:12.2px;color:#42524b;padding:2px 0}
.dish b{color:#b0471f;white-space:nowrap;font-weight:600}
.foodopt{border-top:1px dashed #ead9ad;padding:8px 0 4px}
.foodopt:first-of-type{border-top:none}
.foodopt .pl{font-size:13.5px}
.foodopt .note{font-size:11.5px;color:#7b8a82;margin:2px 0 4px}
.slotphoto{position:relative;height:150px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#2ca381,#0f6b52);margin:8px 0 4px}
.slotphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pguide{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.pguide summary{cursor:pointer;font-size:12px;color:#0b6b4c;font-weight:700}
.pgin{font-size:11.8px;color:#5a6a63;padding-top:5px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.geobar{display:flex;gap:7px;align-items:center;background:#e9f6fa;border:1px solid #cfe9f2;border-radius:14px;padding:8px 10px;margin-bottom:11px;flex-wrap:wrap}
.geobar button{border:none;background:var(--brand);color:#fff;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}
.geobar button.alt{background:#fff;color:var(--brand);border:1px solid #bfe0ec}
.geobar .st{font-size:11px;color:#4f6a7a;flex:1;min-width:120px}
.distchip{background:#e7f4f8;color:#0b6b8c}
.hotel-card{border-left:4px solid var(--brand)}
.hotel-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.hotel-top b{font-size:15px;line-height:1.35}
.hotel-date{font-size:10.5px;color:#fff;background:#0f6b52;border-radius:999px;padding:3px 9px;white-space:nowrap}
.hotel-addr{font-size:11.5px;color:var(--dim);margin:5px 0 7px}
.line-item{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:7px}
.line-item .ic{font-size:18px;flex:none;width:30px;text-align:center}
.line-item b{font-size:13px}
.line-item p{font-size:11.5px;color:#56665f;margin-top:2px}
.check-group{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 13px;margin-bottom:10px}
.check-group h4{font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.check-group h4 .cnt{font-size:11px;color:#6f7e78;font-weight:500}
.bar{height:5px;border-radius:4px;background:#edf2ef;margin:7px 0 9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:4px;width:0;transition:width .2s}
.chk-item{display:flex;align-items:flex-start;gap:9px;padding:6px 0;font-size:12.8px}
.chk-item input{width:17px;height:17px;accent-color:var(--brand);margin-top:2px;flex:none}
.chk-item.done{color:#98a49f;text-decoration:line-through}
.sheet{position:fixed;inset:0;background:rgba(20,35,30,.42);z-index:60;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .box{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:600px;padding:16px 16px 16px;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet .handle{width:38px;height:4px;background:#dfe6e2;border-radius:4px;margin:0 auto 12px}
.sheet h3{font-size:17px;margin-bottom:3px}
.sheet .sub{font-size:12px;color:var(--dim);margin-bottom:12px}
.sheet .addr{background:#f3f7f4;border-radius:12px;padding:10px 12px;font-size:12.5px;color:#3d4d46;margin-bottom:12px;word-break:break-all;white-space:pre-wrap}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini-note{font-size:11.5px;color:#8b9892;margin-top:10px;text-align:center}
.dishphoto{position:relative;height:140px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#0e7c9c,#57c6dd);margin-bottom:7px}
.dishphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.guide-item{border:1px solid #e3edf1;background:#fbfeff;border-radius:13px;padding:10px 12px;margin-bottom:8px}
.guide-item .gname{font-weight:800;font-size:14px}
.guide-item .gmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.guide-item .gmust{font-size:12.2px;color:#3f514a;margin-top:6px}
.guide-item .gsrc{font-size:11px;color:#8a9791;margin-top:5px}
.guide-item .gcomment{font-size:11.5px;color:#a0522d;margin-top:4px}
.listitem{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 13px;margin-bottom:8px}
.listitem .txt{font-size:12.8px;flex:1}
.listitem .deadline{font-size:11px;color:var(--danger);white-space:nowrap}
.flight{border-left:4px solid var(--brand2)}
.flight .note{font-size:11.3px;color:#85928c;margin-top:3px}
@media (min-width:600px){ .tabbar{max-width:600px;left:50%;transform:translateX(-50%);border-radius:16px 16px 0 0} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">🌊</div>
      <div><h1>青岛海边亲子 · 迷你版</h1><p id="app-dates"></p></div>
    </div>
    <span class="pill" id="app-count"></span>
  </header>

  <div class="geobar">
    <button id="geo-btn">📍 开启实时距离</button>
    <button id="geo-sort" class="alt" style="display:none">↕ 由近到远</button>
    <span class="st" id="geo-status">未开启定位 · 开启后每个景点/饭店显示距你多远</span>
  </div>

  <div id="view-行程" class="panel on">
    <div class="hero">
      <h2 id="hero-day">点下面第几天开始浏览</h2>
      <p id="hero-sub">每站可一键导航、打车；美食/酒店/交通/清单都在底部</p>
      <div class="quick">
        <button data-goto="美食">🍜 今天吃什么</button>
        <button data-goto="出行">🚗 航班与交通</button>
      </div>
    </div>
    <div id="day-root"></div>
  </div>

  <div id="view-美食" class="panel"></div>
  <div id="view-酒店" class="panel"></div>
  <div id="view-出行" class="panel"></div>
  <div id="view-清单" class="panel"></div>
  <div class="bottom-spacer" style="height:150px"></div>
</div>

<nav class="tabbar">
  <button data-tab="行程" class="on"><span class="ic">🗓</span>行程</button>
  <button data-tab="美食"><span class="ic">🍜</span>美食</button>
  <button data-tab="酒店"><span class="ic">🏨</span>酒店</button>
  <button data-tab="出行"><span class="ic">🚗</span>出行</button>
  <button data-tab="清单"><span class="ic">✅</span>清单</button>
</nav>

<div class="sheet" id="sheet-nav">
  <div class="box">
    <div class="handle"></div>
    <h3 id="sheet-title">导航到此</h3>
    <p class="sub">选择地图 App 打开；打车请复制定位后粘贴到高德/滴滴。</p>
    <div class="addr" id="sheet-addr"></div>
    <div class="row">
      <a class="btn primary" id="lnk-apple" target="_blank" rel="noopener">🍎 苹果地图</a>
      <a class="btn primary" id="lnk-google" target="_blank" rel="noopener">🧭 谷歌地图</a>
      <a class="btn primary" id="lnk-amap" target="_blank" rel="noopener">🗺 高德地图</a>
      <button class="btn gold" id="btn-copy">📋 复制定位</button>
      <a class="btn" href="https://www.amap.com" target="_blank" rel="noopener" style="grid-column:1/-1">🚕 打开高德地图（打车/导航）</a>
    </div>
    <p class="mini-note">青岛打车用高德/滴滴/花小猪；复制定位后在打车 App 里粘贴地点即可叫车。</p>

<script>
(function(){
  var TRIP = JSON.parse(document.getElementById('trip-data').textContent);
  var PERIOD = {morning:'上午', noon:'中午', afternoon:'下午', evening:'晚上'};
  var state = { day: 0, tab: '行程' };
  var geo = { pos: null, sort: false, watch: null };

  function hav(la1,ln1,la2,ln2){
    var R=6371, dLa=(la2-la1)*Math.PI/180, dLn=(ln2-ln1)*Math.PI/180;
    var a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLn/2)*Math.sin(dLn/2);
    return 2*R*Math.asin(Math.sqrt(a));
  }
  function slotDist(s){ return geo.pos?hav(geo.pos.lat,geo.pos.lng,s.lat,s.lng):99999; }
  function foodDist(o){ return (geo.pos&&typeof o.lat==='number')?hav(geo.pos.lat,geo.pos.lng,o.lat,o.lng):99999; }
  function fmtKm(km){ return km<1?(Math.round(km*1000)+' m'):(km<10?km.toFixed(1):Math.round(km))+' km'; }
  function estTime(km){ return km<1.2 ? ('步行约 '+Math.max(1,Math.round(km/0.08))+' 分钟') : ('车程约 '+Math.max(2,Math.round(km/0.4))+' 分钟'); }
  function refreshDistances(){
    var els=document.querySelectorAll('.distchip');
    if(!geo.pos){ els.forEach(function(e){ e.textContent='📍 --'; }); return; }
    els.forEach(function(e){
      var la=Number(e.getAttribute('data-geo-lat')), ln=Number(e.getAttribute('data-geo-lng'));
      if(!la||!ln) return;
      var km=hav(geo.pos.lat,geo.pos.lng,la,ln);
      e.textContent='📍 '+fmtKm(km)+' · '+estTime(km);
    });
    var st=document.getElementById('geo-status');
    if(st) st.textContent='定位中 · 精度约 '+Math.round(geo.pos.acc||0)+' m（距离为直线）';
  }
  function startGeo(){
    if(!navigator.geolocation){ alert('当前浏览器不支持定位，请用 Safari/Chrome 打开。'); return; }
    document.getElementById('geo-status').textContent='正在获取定位…';
    if(geo.watch!=null && navigator.geolocation.clearWatch) navigator.geolocation.clearWatch(geo.watch);
    geo.watch=navigator.geolocation.watchPosition(function(p){
      geo.pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
      document.getElementById('geo-btn').textContent='📍 实时定位中';
      document.getElementById('geo-sort').style.display='inline-block';
      try{ sessionStorage.setItem('trip-geo','1'); }catch(e){}
      if(state.tab==='行程') renderDay();
      else if(state.tab==='美食') renderFood();
      else refreshDistances();
    }, function(err){
      document.getElementById('geo-status').textContent='定位失败：'+(err.message||'请检查定位权限')+'（iOS 需在 HTTPS 页面允许定位）';
    }, {enableHighAccuracy:true, maximumAge:8000, timeout:20000});
  }

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function setDates(){
    document.getElementById('app-dates').textContent = TRIP.days[0].date + ' → ' + TRIP.days[TRIP.days.length-1].date;
    document.getElementById('app-count').textContent = TRIP.days.length + ' 天';
  }

  function mapLinks(p){
    var q = encodeURIComponent(p.lat + ',' + p.lng);
    return {
      apple:'https://maps.apple.com/?ll='+p.lat+','+p.lng+'&q='+encodeURIComponent(p.name),
      google:'https://www.google.com/maps/search/?api=1&query='+q,
      amap:'https://uri.amap.com/marker?position='+p.lng+','+p.lat+'&name='+encodeURIComponent(p.name)+'&coordinate=wgs84&callnative=1'
    };
  }

  function bindNavCopy(root){
    root.querySelectorAll('[data-nav]').forEach(function(b){ b.addEventListener('click', function(){ openPoint({name:b.getAttribute('data-name'),lat:Number(b.getAttribute('data-lat')),lng:Number(b.getAttribute('data-lng'))}, true); }); });
    root.querySelectorAll('[data-copy]').forEach(function(b){ b.addEventListener('click', function(){ openPoint({name:b.getAttribute('data-name'),lat:Number(b.getAttribute('data-lat')),lng:Number(b.getAttribute('data-lng'))}, false); }); });
  }

  function showSheet(id){ document.getElementById(id).classList.add('on'); }
  function hideSheets(){ document.querySelectorAll('.sheet').forEach(function(s){ s.classList.remove('on'); }); }
  function openPoint(p, isNav){
    var links = mapLinks(p);

  function renderDayStrip(){
    var h = '<div class="daystrip">';

      h += '<div class="daychip'+(i===state.day?' on':'')+'" data-day="'+i+'"><div class="d">'+d.date.slice(5).replace('-','/')+'</div><div class="n">'+(i+1)+'</div><small>'+esc(d.weekday)+'</small></div>';

  function mealHTML(list){
    if(!list||!list.length) return '<div class="dining"><h4>本日无单独餐饮安排</h4><p style="font-size:12px;color:#6b5836">餐点多随行程简餐/夜市解决，可切到“美食”页签查看。</p></div>';
    return '<div class="dining"><h4>🍜 今日吃喝</h4>'+list.map(function(m){
      var ds=(m.dishes||[]).map(function(x){ return '<div class="meal"><span>'+esc(x.name)+'</span><b>'+esc(x.price||'')+'</b></div>'; }).join('');
      return '<p style="margin-top:6px;font-weight:700">'+esc(m.meal)+' · '+esc(m.place)+(m.hours?'（'+esc(m.hours)+'）':'')+'</p>'+ds;
    }).join('')+'</div>';
  }
  function slotHTML(s){
    var meta='';
    if(s.rating) meta+='<span class="chip">★ '+esc(String(s.rating))+'</span>';
    if(s.openingHours) meta+='<span class="chip">🕐 '+esc(s.openingHours)+'</span>';
    if(s.ticketPrice) meta+='<span class="chip">🎫 '+esc(s.ticketPrice)+'</span>';
    if(s.transport&&s.transport.mode) meta+='<span class="chip">🚕 '+esc(s.transport.mode)+(s.transport.duration?' · '+esc(s.transport.duration):'')+'</span>';
    if(s.needsBooking) meta+='<span class="chip book">⚠ 提前'+s.leadDays+'天订</span>';
    if(typeof s.lat==='number'&&typeof s.lng==='number') meta+='<span class="chip distchip" data-geo-lat="'+s.lat+'" data-geo-lng="'+s.lng+'">📍 --</span>';
    return '<div class="item"><div class="t">'+esc(s.time||'')+'</div><div class="body">'+
      '<div class="nm">'+esc((s.period?PERIOD[s.period]+' · ':'')+s.name)+'</div>'+
      (s.review?'<div class="rv">'+esc(s.review)+'</div>':'')+
      (s.photo?'<div class="slotphoto"><img src="'+esc(s.photo)+'" alt="'+esc(s.name)+'" loading="lazy" onerror="this.style.display=\'none\'"></div>':'')+
      '<div class="meta">'+meta+'</div>'+
      '<details class="pguide"><summary>📖 攻略 / 实用信息</summary><div class="pgin">'+
        (s.openingHours?'🕐 营业/开放：'+esc(s.openingHours)+'<br>':'')+
        (s.ticketPrice?'🎫 门票：'+esc(s.ticketPrice)+'<br>':'')+
        (s.transport?('🚕 交通：'+esc(s.transport.mode||'')+(s.transport.duration?(' · '+esc(s.transport.duration)):'')+(s.transport.fare?(' · '+esc(s.transport.fare)):'')+'<br>'):'')+
        (s.seasonal?('🌸 时令：'+esc(s.seasonal)+'<br>'):'')+
        (s.needsBooking?('⚠ 建议提前 '+s.leadDays+' 天预订<br>'):'')+

      '</div></details>'+

      '</div></div></div>';

  function renderDay(){
    var d = TRIP.days[state.day];
    var h = renderDayStrip();
    h += '<div class="card day-head"><div><h2>第 '+(state.day+1)+' 天 · '+esc(d.weekday)+' '+esc(d.date)+'</h2><div class="tag">'+esc(d.theme||'')+'</div></div></div>';
    if(d.tips&&d.tips.length) h+='<div class="tipbox">'+d.tips.map(function(t){return '<p>'+esc(t)+'</p>';}).join('')+'</div>';
    var slots=(d.slots||[]).slice();
    if(geo.sort&&geo.pos){ slots.sort(function(a,b){ return slotDist(a)-slotDist(b); }); }
    slots.forEach(function(s){ h+='<div class="card">'+slotHTML(s)+'</div>'; });
    h += '<div class="card">'+mealHTML(d.dining)+'</div>';
    document.getElementById('hero-day').textContent='第 '+(state.day+1)+' 天 · '+esc(d.weekday);
    document.getElementById('hero-sub').textContent='今日主题：'+(d.theme||'');
    document.getElementById('day-root').innerHTML=h;
    document.querySelectorAll('.daychip').forEach(function(c){ c.addEventListener('click',function(){ state.day=Number(c.getAttribute('data-day')); renderDay(); }); });

    refreshDistances();
  }

    h+='<div class="line-item"><div class="ic">⚓</div><div><b>青岛湾栈桥码头环游</b><p>栈桥码头｜30 分钟｜栈桥、小青岛、天主教堂同框；冬天海鸥多。<br>👶 2 岁宝宝：✅ 短程好安排，人多时看好孩子。</p></div></div>';
    h+='<div class="line-item"><div class="ic">🌊</div><div><b>小麦岛快艇航线</b><p>小麦岛游船码头（地铁 2 号线麦岛站 E 口步行 15 分钟）｜30 分钟｜可小麦岛往返奥帆。<br>👶 2 岁宝宝：❌ 快艇颠簸，不建议带 2 岁乘坐（先确认年龄限制）。</p></div></div>';
    h+='<div class="line-item"><div class="ic">🌉</div><div><b>东大洋环游（城阳）</b><p>城阳东大洋码头｜30 分钟｜10:00–16:00 每小时一班｜近看胶州湾大桥。<br>👶 2 岁宝宝：⚠️ 离石老人远，专程去性价比一般。</p></div></div>';
    h+='<div class="card" style="background:#e9f6fa;border-color:#cfe9f2"><b>🎟 奥帆中心游船购票与班次（评论区实测）</b><p style="font-size:12.3px;color:#2c5b6b;margin-top:5px">• 每 30 分钟一班，当天买票即可，不用提前预约；抖音/美团常有通票优惠，参考 30–45 元/人。<br>• 想看蓝绿“钻石海”可坐 13:00 前后班次；想看日落“橘子海”选 17:00 / 17:30 那班，约 90 分钟，天气好还能看海鸥。<br>• 船内有一点点晕但有座位可坐；节假日傍晚排队久，可错峰或改白天班。<br>• 快艇人少、约 45 元/人、秒上船，但颠簸明显，2 岁宝宝不建议。</p></div>';
    h+='<div class="tipbox"><p>带 2 岁宝宝选船：优先奥帆三湾、八大峡、栈桥码头这类大船短程（30–40 分钟）；提前问儿童救生衣和年龄限制；90 分钟的日落班对 2 岁宝宝偏长，建议选白天短程。海上风大带薄外套、帽子，晕船药请遵医嘱。若帆船停航，用奥帆三湾游船替代最顺路。</p></div>';
    h+='<div class="section"><h3>🛍 特产去哪儿买</h3><span>小红书推荐「青岛有礼」</span></div>';
    h+='<div class="card"><p style="font-size:12.5px;color:#42524b;line-height:1.9">特产集合店「<b>青岛有礼</b>」可以一站式买齐：现烤鱼片、黄花鱼干、海苔片、啤酒酥、钙奶饼干、虾饼、崂山茶，还有海鸥玩偶等文创。<br>适合毕业旅行/伴手礼；台东一带也有分店，顺路逛台东夜市时可以一起买。</p></div>';
    document.getElementById('view-出行').innerHTML=h;
  }

  /* ===== 清单 ===== */
  function ckKey(g,i){ return 'thai-ck-'+g+'-'+i; }
  function ckGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function ckSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function ckClear(){ try{ localStorage.clear(); }catch(e){} }
  function renderChecklist(){
    var h='<div class="section"><h3>出发前待办</h3><span>完成一项勾一项，本机自动保存</span></div>';
    (TRIP.reminders||[]).map(function(r){
      var dt=new Date(TRIP.startDate+'T00:00:00Z'); dt.setUTCDate(dt.getUTCDate()-r.leadDays);
      return {item:r.item, date:dt.toISOString().slice(0,10)};
    }).sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(r){
      h+='<div class="listitem"><div class="txt"><b>'+esc(r.item)+'</b></div><div class="deadline">'+r.date+' 前</div></div>';
    });
    h+='<div class="section"><h3>查漏补缺清单</h3><span id="ck-summary"></span></div>';
    var total=0,done=0;
    (TRIP.checklists||[]).forEach(function(g,gi){
      var items=g.items||[]; var gdone=0;
      items.forEach(function(it,ii){ if(ckGet(ckKey(gi,ii))==='1'){ gdone++; done++; } total++; });
      h+='<div class="check-group"><h4>'+esc(g.icon||'✅')+' '+esc(g.name)+'<span class="cnt" id="ck-cnt-'+gi+'">'+gdone+'/'+items.length+'</span></h4><div class="bar"><i id="ck-bar-'+gi+'" style="width:'+(items.length?Math.round(gdone/items.length*100):0)+'%"></i></div>';
      items.forEach(function(it,ii){
        var on=ckGet(ckKey(gi,ii))==='1';
        h+='<label class="chk-item'+(on?' done':'')+'"><input type="checkbox" data-g="'+gi+'" data-i="'+ii+'" '+(on?'checked':'')+'><span>'+esc(it)+'</span></label>';
      });
      h+='</div>';
    });
    h+='<button class="btn" id="ck-reset" style="width:100%">↺ 重置所有勾选</button>';
    document.getElementById('view-清单').innerHTML=h;
    document.getElementById('ck-summary').textContent=done+'/'+total+' 已准备';
    document.querySelectorAll('#view-清单 input[type=checkbox]').forEach(function(cb){
      cb.addEventListener('change', function(){
        var gi=Number(cb.getAttribute('data-g')), ii=Number(cb.getAttribute('data-i'));
        ckSet(ckKey(gi,ii), cb.checked?'1':'0');
        renderChecklist();
      });
    });
    document.getElementById('ck-reset').addEventListener('click', function(){
      if(confirm('确定重置全部勾选状态吗？')){ ckClear(); renderChecklist(); }
    });
  }

  /* ===== 页签切换 ===== */
  function switchTab(name){
    state.tab=name;
    document.querySelectorAll('.tabbar button').forEach(function(x){ x.classList.remove('on'); });
    document.querySelector('.tabbar button[data-tab="'+name+'"]').classList.add('on');
    document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('on'); });
    document.getElementById('view-'+name).classList.add('on');
    if(name==='美食') renderFood();
    if(name==='酒店') renderHotels();
    if(name==='出行') renderTravel();
    if(name==='清单') renderChecklist();
    window.scrollTo(0,0);
  }
  document.querySelectorAll('[data-tab]').forEach(function(b){ b.addEventListener('click', function(){ switchTab(b.getAttribute('data-tab')); }); });
  document.querySelectorAll('[data-goto]').forEach(function(b){ b.addEventListener('click', function(){ switchTab(b.getAttribute('data-goto')); }); });
  document.getElementById('btn-copy').addEventListener('click', function(){
    var txt=document.getElementById('sheet-addr').textContent;
    function ok(){ var b=document.getElementById('btn-copy'); b.textContent='✓ 已复制'; setTimeout(function(){ b.textContent='📋 复制定位'; },1500); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok); }
    else { var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); ok(); }
  });
  document.querySelectorAll('.sheet').forEach(function(s){ s.addEventListener('click',function(e){ if(e.target===s) s.classList.remove('on'); }); });
  document.getElementById('geo-btn').addEventListener('click', startGeo);
  document.getElementById('geo-sort').addEventListener('click', function(){
    geo.sort=!geo.sort;
    this.textContent=geo.sort?'↕ 已按距离排序':'↕ 由近到远';
    if(state.tab==='行程') renderDay(); else if(state.tab==='美食') renderFood(); else refreshDistances();
  });

  setDates();
  renderDay();
  renderFood();
  renderHotels();
  renderTravel();
  renderChecklist();
  try{ if(sessionStorage.getItem('trip-geo')==='1'){ startGeo(); } }catch(e){}
  refreshDistances();
})();
</script>
</body>
</html>
